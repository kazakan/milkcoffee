name: Build & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]
  workflow_dispatch:

# Allow one concurrent deployment.
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install wasm-bindgen-cli (exact version matching Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Run Rust unit tests
        run: cargo test --manifest-path wasm/Cargo.toml

      - name: Build WASM & generate JS bindings
        run: bash build.sh

      - name: Download face detector models
        run: |
          set -euo pipefail
          mkdir -p www/models

          curl -fL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' \
            -o www/models/face_detector.tflite

          curl -fL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_sc.zip' \
            -o /tmp/buffalo_sc.zip
          unzip -j /tmp/buffalo_sc.zip 'det_500m.onnx' -d /tmp/buffalo_sc/
          cp /tmp/buffalo_sc/det_500m.onnx www/models/scrfd_500m_bnkps.onnx
          rm -rf /tmp/buffalo_sc.zip /tmp/buffalo_sc

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run frontend tests
        run: npm test

      # Prevent Jekyll from ignoring files that start with _ and from
      # trying to process the wasm-bindgen output.
      - name: Add .nojekyll
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: touch www/.nojekyll

      - name: Setup GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload Pages artefact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: www/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
